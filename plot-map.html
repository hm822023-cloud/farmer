<!DOCTYPE html>
<html>
<head>
    <title>Farm Plot Navigation</title>
</head>
<body>

    <h1>Farm Plot Navigation</h1>

    <img src="farmmap.jpg" alt="Farm Map" usemap="#farmmap" width="600" height="400">

    <map name="farmmap">

        <area shape="rect"
              coords="50,50,180,180"
              href="plotA.html"
              alt="Plot A">

        <area shape="rect"
              coords="220,50,350,180"
              href="plotB.html"
              alt="Plot B">

        <area shape="rect"
              coords="390,50,520,180"
              href="plotC.html"
              alt="Plot C">

    </map>

</body>
</html>
